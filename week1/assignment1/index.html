<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điểm Của Em</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div class="container">
        <div class="title">BANG DIEM CUA EM</div>
        
        <div class="form-group">
            <label for="semester1">Semester1:</label>
            <input type="text" id="semester1" value="9">
        </div>

        <div class="form-group">
            <label for="semester2">Semester2:</label>
            <input type="text" id="semester2" value="10">
        </div>

        <div class="form-group">
            <label for="year">Year:</label>
            <select id="year">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </div>

        <div class="form-group">
            <label for="summarise">Summarise:</label>
            <input type="text" id="summarise" value="9.571428571428571" readonly>
        </div>

        <div class="result-status"></div>

        <div class="button-group">
            <button class="ok" value="ok" type="button" onclick="process()">OK</button>
            <button class="cancel" value="cancel" type="button" onclick="cancel()">Cancel</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
