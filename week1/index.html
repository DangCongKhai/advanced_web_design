<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Women Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <nav class="main-nav" aria-label="Main navigation">
          <a href="#">Home</a>
          <a href="#">Shop</a>
          <a href="#">Collection</a>
          <a href="#">New In</a>
          <a href="#">Accessories</a>
          <a href="#">Contact</a>
        </nav>
      </header>

      <main class="hero-section">
        <div class="hero-heading-wrap">
          <h1>Women Product</h1>
          <hr>
        </div>

        <div class="content-grid">
          <div class="product-cards" aria-label="Featured products">
            <article class="product-card">
              <img
                src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=80"
                alt="Elegant fashion item for women"
              />
              <div class="card-info">
                <div class="card-copy">
                  <h3 class="tag" style="color: red; text-align:center; width: 100%;">New Look</h3>
                  <span class="old-price">$120</span>
                  <span class="new-price">$99</span>
                </div>
                
                <button class="add-cart-btn" type="button">Add to cart</button>
              </div>
            </article>

            <article class="product-card">
              <img
                src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=900&q=80"
                alt="Woman in stylish outfit"
              />
              <div class="card-info">
                <div class="card-copy">
                   <h3 class="tag" style="color: red; text-align:center">New Look</h3>
                  <span class="old-price">$120</span>
                  <span class="new-price">$99</span>
                </div>
            
                <button class="add-cart-btn" type="button">Add to cart</button>
              </div>
            </article>
          </div>

          <div
            class="promo-panel"
            style="background-image: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)), url('https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=80');"
          >
            <p class="promo-title">Text For Women</p>
            <button type="button" class="view-all">View All</button>
          </div>
        </div>
      </main>
    </div>
    <script src="index.js"></script>
  </body>
  
</html>
