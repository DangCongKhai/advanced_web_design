<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điểm Của Em</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #8c8c8c;
            border: 2px solid #ff0000;
            width: 650px;
            padding: 30px;
            box-sizing: border-box;
        }

        .title {
            color: #2b579a;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-group label {
            width: 120px;
            font-size: 18px;
            color: #000;
        }

        .form-group input[type="text"] {
            flex: 1;
            padding: 6px;
            font-size: 18px;
            border: 1px solid #ccc;
            background-color: #ffffff;
        }

        .form-group input[readonly] {
            background-color: #e2e2da;
            border: 1px solid #b5b5ab;
        }

        .form-group select {
            width: 60px;
            padding: 4px;
            font-size: 18px;
            border: 1px solid #ff0000;
            color: #ff0000;
            background-color: #ffffff;
        }

        .result-status {
            color: #ff0000;
            font-size: 32px;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #7a7a7a;
            padding: 6px 24px;
            font-size: 18px;
            cursor: pointer;
            min-width: 90px;
            text-align: center;
        }

        .btn:hover {
            background-color: #e6e6e6;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">BANG DIEM CUA EM</div>
        
        <div class="form-group">
            <label for="semester1">Semester1:</label>
            <input type="text" id="semester1" value="9">
        </div>

        <div class="form-group">
            <label for="semester2">Semester2:</label>
            <input type="text" id="semester2" value="10">
        </div>

        <div class="form-group">
            <label for="year">Year:</label>
            <select id="year">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </div>

        <div class="form-group">
            <label for="summarise">Summarise:</label>
            <input type="text" id="summarise" value="9.571428571428571" readonly>
        </div>

        <div class="result-status"></div>

        <div class="button-group">
            <button class="ok" value="ok" type="button" onclick="process()">OK</button>
            <button class="cancel" value="cancel" type="button" onclick="cancel()">Cancel</button>
        </div>
    </div>
    <script>
        function process(){
            const semester1Score = parseFloat(document.getElementById('semester1').value);
            const semester2Score = parseFloat(document.getElementById('semester2').value);
            const year = parseInt(document.getElementById('year').value);
            if (isNaN(semester1Score) || isNaN(semester2Score)) {
                document.querySelector('.result-status').textContent = 'Please enter valid scores for both semesters.';
                return;
            }
            let summarise;
            if (year == 1){
                summarise = (semester1Score + semester2Score) / 2;
            } else {
                summarise = (semester1Score + semester2Score * 2) / 3;
            }
            
            document.getElementById('summarise').value = summarise.toFixed(2);
            if (summarise >= 9) {
                document.querySelector('.result-status').innerHTML = 'Giỏi';
                document.querySelector('.result-status').style.color = 'red';
            } else if (summarise >= 8) {
                document.querySelector('.result-status').innerHTML = 'Khá';
                document.querySelector('.result-status').style.color = 'blue';
            } else if (summarise >= 7) {
                document.querySelector('.result-status').innerHTML = 'Trung bình';
                document.querySelector('.result-status').style.color = 'orange';
            } else if (summarise >= 5) {
                document.querySelector('.result-status').innerHTML = 'Yếu';
                document.querySelector('.result-status').style.color = 'yellow';
            } else {
                document.querySelector('.result-status').innerHTML = 'Kém';
                document.querySelector('.result-status').style.color = 'purple';
            }
            
        }

        function cancel(){
            document.getElementById('semester1').value = '';
            document.getElementById('semester2').value = '';
            document.getElementById('year').value = '1';
            document.getElementById('summarise').value = '';
            document.querySelector('.result-status').textContent = '';
        }
    </script>
</body>
</html>
