<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app-container">
        <!-- Add Tour Section -->
        <div class="add-tour-section">
            <h2>Add New Tour</h2>
            <form id="add-form" class="tour-form">
                <input type="text" id="add-name" placeholder="Tour Name" required>
                <input type="text" id="add-image" placeholder="Image URL" required>
                <input type="text" id="add-description" placeholder="Description" required>
                <label class="date-field">
                    Start date
                    <input type="date" id="add-start-date" required>
                </label>
                <label class="date-field">
                    End date
                    <input type="date" id="add-end-date" required>
                </label>
                <input type="number" id="add-price" placeholder="Price" step="0.01" required>
                <button type="submit" id="add-btn">Add Tour</button>
            </form>
        </div>

        <!-- Bulk Delete Section -->
        <div class="bulk-delete-section">
            <button id="delete-btn" class="delete-btn" disabled>Delete 0 items</button>
        </div>

        <!-- Tour List -->
        <div class="tour-list" id="tour-list"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
